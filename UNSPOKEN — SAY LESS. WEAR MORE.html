<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>UNSPOKEN — SAY LESS. WEAR MORE.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f0;--fg:#0a0a0a;--mut:#77746f;--line:#d9d5ce;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f3f1ec;--mut:#8f8b85;--line:#2a2927;--card:#141413}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f3f1ec;--mut:#8f8b85;--line:#2a2927;--card:#141413}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--fg);font:300 15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px 5vw}
.logo{font-size:24px;letter-spacing:.32em}nav{display:flex;gap:30px;font-size:11px;letter-spacing:.2em}
nav a{opacity:.65;transition:.3s}nav a:hover,nav a.on{opacity:1}
.cartb{font-size:11px;letter-spacing:.2em;background:none;border:0}.menu{display:none;background:none;border:0;font-size:11px;letter-spacing:.2em}
@media(max-width:760px){.menu{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid var(--line)}nav.open{display:flex}nav a{padding:18px 5vw;border-top:1px solid var(--line)}header .logo{font-size:19px}}
main{min-height:70vh;animation:in .6s ease}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.btn{display:inline-block;border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:16px 34px;font-size:11px;letter-spacing:.24em;transition:.3s;min-height:48px}
.btn:hover{background:transparent;color:var(--fg)}.btn.o{background:transparent;color:var(--fg)}.btn.o:hover{background:var(--fg);color:var(--bg)}
.hero{position:relative;height:88vh;min-height:520px;background:#000 center/cover;color:#fff;display:flex;align-items:flex-end}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.82))}
.hero div{position:relative;z-index:1;padding:0 5vw 8vh;max-width:760px}.hero h1{font-size:clamp(44px,9vw,104px);line-height:.95;letter-spacing:.02em}
.hero p{margin:22px 0 30px;max-width:460px;opacity:.85}.hero .btn{background:#fff;color:#000;border-color:#fff}.hero .btn:hover{background:transparent;color:#fff}
section{padding:90px 5vw}.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--mut);margin-bottom:14px}h2{font-size:clamp(30px,5vw,52px);margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:34px 22px}
.card .im{aspect-ratio:4/5;overflow:hidden;background:var(--card)}.card img{width:100%;height:100%;object-fit:cover;transition:transform .8s}.card:hover img{transform:scale(1.05)}
.card h3{font-size:22px;margin-top:14px}.card .p{color:var(--mut);font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}@media(max-width:760px){.split{grid-template-columns:1fr}section{padding:60px 5vw}}
.split img{width:100%;display:block}.coll{position:relative;margin-bottom:26px}.coll img{width:100%;height:70vh;object-fit:cover;display:block}
.coll div{position:absolute;left:0;right:0;bottom:0;padding:30px 5vw;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8))}.coll h3{font-size:36px}.coll .btn{margin-top:14px;background:#fff;color:#000;border-color:#fff}
.bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}select,input,textarea{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:13px;width:100%;border-radius:0}select{width:auto}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:5vw}@media(max-width:760px){.pd{grid-template-columns:1fr}}
.zoom{overflow:hidden;cursor:zoom-in;background:var(--card)}.zoom img{width:100%;display:block;transition:transform .4s;transform-origin:center}.zoom.z img{transform:scale(2)}.zoom.z{cursor:zoom-out}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}.sz{min-width:52px;min-height:48px;background:none;border:1px solid var(--line)}.sz.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.err{color:#c0392b;font-size:13px;min-height:20px}ul.d{padding-left:18px;color:var(--mut);margin:14px 0 26px}
.row{display:grid;grid-template-columns:80px 1fr auto;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}.row img{width:80px;height:96px;object-fit:cover}
.q{display:inline-flex;border:1px solid var(--line);margin-top:8px}.q button{width:40px;height:40px;background:none;border:0}.q span{width:34px;text-align:center;line-height:40px}
.rm{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;margin-left:12px}
.form{display:grid;gap:14px;max-width:560px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tot{display:flex;justify-content:space-between;padding:8px 0}
.narrow{max-width:760px}.narrow p{margin-bottom:16px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:60px 5vw 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:34px;font-size:13px;color:var(--mut)}footer a{display:block;margin:6px 0}footer b{color:var(--fg);font-weight:500;letter-spacing:.2em;font-size:11px;display:block;margin-bottom:10px}
#ld{position:fixed;inset:0;background:#0a0a0a;color:#fff;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s}#ld .logo{font-size:30px;letter-spacing:.5em;animation:p 1.4s ease infinite}@keyframes p{50%{opacity:.3}}
.nl{display:flex;gap:10px;max-width:480px;margin:0 auto}.c{text-align:center}
</style></head><body>

{id:"wave",name:"Eastern Wave Tee",price:580,img:IM.wave,col:"Silence",desc:"Oversized heavyweight tee with the fluid “Silence” back print.",det:["Oversized boxy fit","Heavyweight cotton, white","Large back print, UNSPOKEN neck label"],avail:true},
{id:"crazy",name:"Crazy People Tee",price:660,img:IM.crazy,col:"Signature",desc:"Statement back graphic in black and red. Not for everyone.",det:["Oversized boxy fit","Heavyweight cotton, white","Large back graphic, US chest mark"],avail:true},
{id:"emo",name:"Emotions Differ Tee",price:500,img:IM.emo,col:"Signature",desc:"Hand-drawn characters, six feelings, one shirt.",det:["Oversized boxy fit","Heavyweight cotton, white","Full-colour back graphic"],avail:true}];
const COLLS=[{n:"Silence",img:IM.hero,d:"Quiet graphics, loud presence. The limited Silence release."},{n:"Signature",img:IM.m2,d:"The UNSPOKEN signature pieces: bold, defiant, wearable."}];
const R=n=>"R"+n.toLocaleString("en-ZA").replace(/\u00a0/g," ");
let cart=[];try{cart=JSON.parse(localStorage.getItem("us_cart")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("us_cart",JSON.stringify(cart))}catch(e){}document.getElementById("cc").textContent=cart.reduce((a,c)=>a+c.q,0)};
const P=id=>PRODUCTS.find(p=>p.id===id);const sub=()=>cart.reduce((a,c)=>a+P(c.id).price*c.q,0);
const card=p=>`<a class="card" href="#p-${p.id}"><div class="im"><img src="${p.img}" alt="${p.name}" loading="lazy"></div><h3>${p.name}</h3><div class="p">${R(p.price)}</div></a>`;
const V={
home:()=>`<div class="hero" style="background-image:url(${IM.hero})"><div><h1>SAY LESS.<br>WEAR MORE.</h1><p>More than clothing. A statement without words. Discover UNSPOKEN, where identity meets expression.</p><a class="btn" href="#shop">SHOP THE COLLECTION</a></div></div>
<section><div class="eyebrow">NEW ARRIVALS</div><h2>The latest drop</h2><div class="grid">${PRODUCTS.map(card).join("")}</div></section>
<section style="background:var(--card)"><div class="split"><img src="${IM.m2}" alt="UNSPOKEN campaign"><div><div class="eyebrow">EXPLORE THE COLLECTION</div><h2>Signature</h2><p style="color:var(--mut);margin-bottom:30px">Oversized silhouettes, heavyweight cotton, graphics with something to say.</p><a class="btn o" href="#collections">EXPLORE COLLECTIONS</a></div></div></section>
<section><div class="split"><div><div class="eyebrow">THE UNSPOKEN EXPERIENCE</div><h2>Style speaks first</h2><p style="color:var(--mut);margin-bottom:30px">Order in a few taps and finish on WhatsApp, where we arrange payment and delivery with you personally.</p><a class="btn o" href="#about">OUR STORY</a></div><img src="${IM.m3}" alt="UNSPOKEN model"></div></section>
<section class="c" style="border-top:1px solid var(--line)"><div class="eyebrow">NEWSLETTER</div><h2>Join the inner circle</h2><div class="nl"><input id="nle" placeholder="Your name"><button class="btn" onclick="nl()">JOIN</button></div></section>`,
shop:()=>{const s=sessionStorage;return `<section><div class="eyebrow">SHOP</div><h2>All pieces</h2><div class="bar"><select id="f" onchange="shopr()"><option value="">All collections</option>${COLLS.map(c=>`<option>${c.n}</option>`).join("")}</select><select id="s" onchange="shopr()"><option value="">Sort: Featured</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div><div class="grid" id="sg"></div></section>`},
collections:()=>`<section><div class="eyebrow">COLLECTIONS</div><h2>Limited releases</h2>${COLLS.map(c=>`<div class="coll"><img src="${c.img}" alt="${c.n}"><div><h3>${c.n}</h3><p style="max-width:420px;opacity:.85">${c.d}</p><a class="btn" href="#shop" onclick="window.__f='${c.n}'">EXPLORE COLLECTION</a></div></div>`).join("")}</section>`,
about:()=>`<section><div class="split"><img src="${IM.hero}" alt="UNSPOKEN"><div><div class="eyebrow">ABOUT US</div><h2>Beyond words</h2><p style="color:var(--mut)">UNSPOKEN is more than a clothing brand. It represents identity, individuality and expression beyond words. Built around the idea that style speaks before words do, UNSPOKEN brings together premium streetwear and understated luxury. SAY LESS. WEAR MORE.</p></div></div></section>`,
delivery:()=>pg("Delivery &amp; Returns","Delivery fees and times depend on your location in South Africa and are confirmed with you on WhatsApp before payment. Returns and exchanges for unworn items with tags may be arranged by contacting us on WhatsApp within a few days of delivery; terms to be confirmed by UNSPOKEN."),
privacy:()=>pg("Privacy Policy","We only use the details you enter at checkout to prepare your WhatsApp order message. Your cart is saved in your own browser. This site does not process payments or store your details on a server."),
terms:()=>pg("Terms &amp; Conditions","An order is only confirmed once you have sent your WhatsApp message and UNSPOKEN has acknowledged it. Payment and delivery are arranged directly through WhatsApp. Prices are in South African Rand (ZAR)."),
cart:()=>{if(!cart.length)return `<section class="narrow"><h2>Your bag is empty</h2><a class="btn" href="#shop">CONTINUE SHOPPING</a></section>`;
return `<section class="narrow"><h2>Your bag</h2>${cart.map((c,i)=>{const p=P(c.id);return `<div class="row"><img src="${p.img}" alt=""><div><b style="font-weight:500">${p.name}</b><br><span style="color:var(--mut)">Size ${c.s} · ${R(p.price)}</span><br><span class="q"><button onclick="qty(${i},-1)">−</button><span>${c.q}</span><button onclick="qty(${i},1)">+</button></span><button class="rm" onclick="qty(${i},-99)">Remove</button></div><div>${R(p.price*c.q)}</div></div>`}).join("")}
<div class="tot" style="margin-top:20px"><span>Subtotal</span><span>${R(sub())}</span></div><div class="tot"><span>Delivery</span><span>To be confirmed</span></div><div class="tot" style="font-size:20px"><b style="font-weight:500">TOTAL</b><b style="font-weight:500">${R(sub())}</b></div>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px"><a class="btn o" href="#shop">CONTINUE SHOPPING</a><a class="btn" href="#checkout">CONTINUE TO CHECKOUT</a></div></section>`},
checkout:()=>{if(!cart.length){location.hash="cart";return ""}const f=JSON.parse(sessionStorage.getItem("us_f")||"{}");const i=(k,l,t="text")=>`<input id="${k}" type="${t}" placeholder="${l}" value="${f[k]||""}" autocomplete="on">`;
return `<section><h2>Checkout</h2><div class="split" style="align-items:start"><div class="form"><div class="eyebrow">1 · YOUR DETAILS</div>${i("nm","Full name *")}${i("ph","WhatsApp / contact number *","tel")}${i("em","Email (optional)","email")}${i("ad","Delivery address *")}<div class="two">${i("ct","City *")}${i("pv","Province *")}</div>${i("pc","Postal code *")}<textarea id="nt" rows="3" placeholder="Additional order instructions (optional)">${f.nt||""}</textarea></div>
<div><div class="eyebrow">2 · ORDER SUMMARY</div>${cart.map(c=>{const p=P(c.id);return `<div class="tot"><span>${c.q} × ${p.name} (${c.s})</span><span>${R(p.price*c.q)}</span></div>`}).join("")}<hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class="tot"><span>Subtotal</span><span>${R(sub())}</span></div><div class="tot"><span>Delivery</span><span>To be confirmed</span></div><div class="tot" style="font-size:20px"><b style="font-weight:500">TOTAL</b><b style="font-weight:500">${R(sub())}</b></div>
<div class="err" id="ce" style="margin-top:14px"></div><a id="wl" class="btn o" target="_blank" rel="noopener" style="display:none;width:100%;text-align:center;margin-bottom:12px">TAP HERE IF WHATSAPP DID NOT OPEN</a><button class="btn" style="width:100%" onclick="place()">PLACE ORDER VIA WHATSAPP</button><p style="color:var(--mut);font-size:12px;margin-top:12px">WhatsApp will open with your order ready. Press SEND to submit it. Your order is not confirmed until UNSPOKEN replies.</p></div></div></section>`}};
function pg(t,b){return `<section class="narrow"><h2>${t}</h2><p>${b}</p></section>`}
function shopr(){let f=document.getElementById("f"),s=document.getElementById("s");if(window.__f){f.value=window.__f;window.__f=""}let l=PRODUCTS.filter(p=>p.avail&&(!f.value||p.col===f.value));if(s.value)l.sort((a,b)=>s.value=="a"?a.price-b.price:b.price-a.price);document.getElementById("sg").innerHTML=l.map(card).join("")||"<p>No pieces found.</p>"}
function pdv(p){return `<section><div class="pd"><div class="zoom" onclick="this.classList.toggle('z')"><img src="${p.img}" alt="${p.name}"></div><div><div class="eyebrow">${p.col.toUpperCase()}</div><h2 style="margin-bottom:10px">${p.name}</h2><div style="font-size:20px">${R(p.price)}</div><p style="color:var(--mut);margin-top:16px">${p.desc}</p><div class="eyebrow" style="margin-top:28px">SELECT SIZE</div><div class="sizes">${SZ.map(s=>`<button class="sz" onclick="pick(this,'${s}')">${s}</button>`).join("")}</div><div class="err" id="pe"></div><ul class="d">${p.det.map(d=>`<li>${d}</li>`).join("")}</ul><button class="btn" style="width:100%" onclick="add('${p.id}')">ADD TO CART</button></div></div></section>`}
let sel="";function pick(b,s){sel=s;document.querySelectorAll(".sz").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("pe").textContent=""}
function add(id){if(!sel){document.getElementById("pe").textContent="Please select a size before adding to cart.";return}const x=cart.find(c=>c.id===id&&c.s===sel);x?x.q++:cart.push({id,s:sel,q:1});save();location.hash="cart"}
function qty(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();route()}
function nl(){const n=document.getElementById("nle").value.trim();go(`https://wa.me/${WA}?text=`+encodeURIComponent(`Hello UNSPOKEN. Please add me to your newsletter / new drop updates.${n?" Name: "+n:""}`))}
function place(){const g=k=>document.getElementById(k).value.trim(),k=["nm","ph","em","ad","ct","pv","pc","nt"],f={};k.forEach(x=>f[x]=g(x));try{sessionStorage.setItem("us_f",JSON.stringify(f))}catch(e){}
if(!f.nm||!f.ph||!f.ad||!f.ct||!f.pv||!f.pc){document.getElementById("ce").textContent="Please complete all required fields.";return}
let m=`Hello UNSPOKEN.\n\nI would like to place an order.\n\nCUSTOMER DETAILS:\nName: ${f.nm}\nContact: ${f.ph}\n${f.em?"Email: "+f.em+"\n":""}Delivery Address: ${f.ad}, ${f.ct}, ${f.pv}, ${f.pc}\n\nORDER DETAILS:\n\n`;
cart.forEach((c,i)=>{const p=P(c.id);m+=`${i+1}. ${p.name}\n   Size: ${c.s}\n   Quantity: ${c.q}\n   Price: ${R(p.price*c.q)}\n\n`});
m+=`ORDER SUMMARY:\nSubtotal: ${R(sub())}\nDelivery: To be confirmed\nTOTAL: ${R(sub())}\n${f.nt?"\nNotes: "+f.nt+"\n":""}\nPlease assist me with payment details and delivery arrangements.\n\nThank you.`;
go(`https://wa.me/${WA}?text=`+encodeURIComponent(m))}
function go(u){const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();const w=document.getElementById("wl");if(w){w.href=u;w.style.display="block"}}
function route(){const h=(location.hash||"#home").slice(1),a=document.getElementById("app");let v;
if(h.startsWith("p-")){const p=P(h.slice(2));sel="";v=p?pdv(p):V.home()}else v=(V[h]||V.home)();
a.innerHTML=v;a.style.animation="none";a.offsetHeight;a.style.animation="";if(h==="shop")shopr();window.scrollTo(0,0);
document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.getAttribute("href")==="#"+h))}
window.addEventListener("hashchange",route);save();route();
window.addEventListener("load",()=>setTimeout(()=>{const l=document.getElementById("ld");l.style.opacity=0;setTimeout(()=>l.remove(),800)},900));
</script></body></html>
